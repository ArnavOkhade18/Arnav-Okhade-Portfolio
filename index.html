<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arnav Okhade - Product Management & Strategy Portfolio</title>
  <meta name="description" content="Portfolio of Arnav Okhade (MBA IIM Kashipur '26, B.Tech NIT Hamirpur '22, Ex-Oracle, ATPM @MAQ Software). Showcasing product thinking, business strategy, AI workflows, and data-driven execution." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/case-study.css" />
</head>
<body>

  <!-- Sticky Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="#home" class="nav-logo">
        <span class="logo-badge">AO</span>
        <span>Arnav Okhade</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="#home" class="nav-link">Home</a></li>
          <li><a href="#about" class="nav-link">About</a></li>
          <li><a href="#resume" class="nav-link">Resume</a></li>
          <li><a href="#case-studies" class="nav-link">Case Studies</a></li>
          <li><a href="#experience" class="nav-link">Experience</a></li>
                    <li><a href="#frameworks" class="nav-link">Frameworks</a></li>
          <li><a href="#contact" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="cmd-btn" id="cmdPaletteBtn" title="Command Palette (⌘K)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>⌘K</span>
        </button>

        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>

        <a href="https://www.linkedin.com/in/arnav-okhade-39412a203" target="_blank" rel="noopener noreferrer" class="btn btn-primary nav-connect-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          <span>Connect</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Dynamic Multi-View Viewport (Managed by Router) -->
  <main id="appViewport" class="app-viewport">
    <!-- Rendered dynamically by js/router.js & js/app.js -->
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 Arnav Okhade. Built with modern web standards and first-principles PM rigor.</div>
        <div style="display: flex; gap: 16px;">
          <a href="#case-studies" style="color: var(--text-muted);">Case Studies</a>
          <a href="#resume" style="color: var(--text-muted);">Resume</a>
          <a href="#frameworks" style="color: var(--text-muted);">Frameworks</a>
          <a href="https://www.linkedin.com/in/arnav-okhade-39412a203" target="_blank" rel="noopener noreferrer" style="color: var(--text-muted);">LinkedIn</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Command Palette Modal (Cmd + K) -->
  <div class="cmd-modal-overlay" id="cmdPaletteOverlay">
    <div class="cmd-palette" onclick="event.stopPropagation()">
      <div class="cmd-search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="cmd-input" id="cmdSearchInput" placeholder="Type a page name, case study, or action..." autocomplete="off" />
      </div>
      <ul class="cmd-results" id="cmdResultsList">
        <!-- Rendered by JS -->
      </ul>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
